# Lets GitHub reach Jenkins's webhook, and ONLY the webhook.
#
# K3S-SRV is only on the tailnet, so github.com cannot reach it. This Ingress
# is handled by the Tailscale operator (ingressClassName: tailscale): it
# creates a tailnet device "jenkins-webhook" with a real HTTPS certificate,
# and Tailscale Funnel publishes it on the internet at
#
#   https://jenkins-webhook.tail3228b6.ts.net/github-webhook/
#
# Only the path /github-webhook/ is routed to Jenkins; every other path
# answers 404, so the Jenkins UI stays tailnet-only.
#
# Needs first: the tailnet policy allows Funnel for tag:k8s (nodeAttrs) and
# HTTPS certificates are enabled for the tailnet (CI-PIPELINES.md, step 6).
#
#   kubectl apply -f platform/jenkins/webhook-ingress.yaml
apiVersion: networking.k8s.io/v1                  # the networking API group, where Ingress is defined
kind: Ingress                                     # an HTTP route
metadata:                                         # identity of the object
  name: jenkins-github-webhook                    # Ingress name
  namespace: jenkins                              # must be the namespace of the Service it routes to
  annotations:                                    # settings for the Tailscale operator
    tailscale.com/funnel: "true"                  # publish this on the internet through Tailscale Funnel
spec:                                             # the routing rules
  ingressClassName: tailscale                     # handled by the Tailscale operator, NOT by Traefik
  tls:                                            # the HTTPS name
    - hosts:                                      # one name
        - jenkins-webhook                         # becomes jenkins-webhook.<tailnet>.ts.net, with a certificate Tailscale issues
  rules:                                          # what is routed
    - http:                                       # HTTP rules (the name comes from tls above)
        paths:                                    # only this one path
          - path: /github-webhook/                # the GitHub plugin's webhook endpoint
            pathType: Prefix                      # /github-webhook/ and below
            backend:                              # where it goes
              service:                            # to a Service
                name: jenkins                     # the Service the Jenkins chart creates (release name "jenkins")
                port:                             # on which port
                  number: 8080                    # Jenkins's HTTP port
